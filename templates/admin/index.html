{% extends "admin/index.html" %}

{% block content %}
<div style="background-color: #ffffff; padding: 25px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; border: 1px solid #e2e8f0; max-width: 800px;">
    <h2 style="margin: 0 0 10px 0; color: #1e293b; font-size: 20px;">
        📊 Quick Links
    </h2>
    <a href="/supervisor-report/" style="display: inline-block; background-color: #2563eb; color: white; padding: 10px 20px; border-radius: 6px; font-weight: bold; text-decoration: none; transition: background-color 0.2s;">
        View Supervisor Compliance Report &rarr;
    </a>
</div>
<div style="background-color: #ffffff; padding: 25px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 30px; border: 1px solid #e2e8f0; max-width: 800px;">
    <h2 style="margin: 0 0 10px 0; color: #1e293b; font-size: 20px;">📊 Team Performance Report</h2>
    <p style="color: #64748b; margin: 0 0 20px 0; font-size: 14px;">Select parameters to preview or export task history and completion rates.</p>

    <form id="reportForm" style="display: flex; gap: 15px; align-items: flex-end; flex-wrap: wrap;">
        
        <!-- Dropdown to select "All" or a specific User -->
        <div style="flex: 1; min-width: 200px;">
            <label for="target_user" style="display: block; font-size: 13px; font-weight: bold; color: #475569; margin-bottom: 5px;">Report Target</label>
            <select id="target_user" style="width: 100%; height: 42px; padding: 0 10px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; background-color: white; font-size: 14px; outline: none;">
                <option value="all">Entire Team & Myself</option>
                <!-- JavaScript populates individual names here -->
            </select>
        </div>

        <div style="flex: 1; min-width: 130px;">
            <label for="start_date" style="display: block; font-size: 13px; font-weight: bold; color: #475569; margin-bottom: 5px;">Start Date</label>
            <input type="date" id="start_date" style="width: 100%; height: 42px; padding: 0 10px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; font-size: 14px; outline: none;">
        </div>

        <div style="flex: 1; min-width: 130px;">
            <label for="end_date" style="display: block; font-size: 13px; font-weight: bold; color: #475569; margin-bottom: 5px;">End Date</label>
            <input type="date" id="end_date" style="width: 100%; height: 42px; padding: 0 10px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; font-size: 14px; outline: none;">
        </div>
        
        <!-- NEW: View Preview Button -->
        <button type="button" onclick="previewReport()" style="background-color: #2563eb; color: white; border: none; padding: 0 20px; border-radius: 6px; font-weight: bold; cursor: pointer; height: 42px; transition: background 0.2s;">
            View Report
        </button>

        <button type="button" onclick="downloadReport('csv')" style="background-color: #16a34a; color: white; border: none; padding: 0 20px; border-radius: 6px; font-weight: bold; cursor: pointer; height: 42px; transition: background 0.2s;">
            CSV
        </button>
        
        <button type="button" onclick="downloadReport('pdf')" style="background-color: #e11d48; color: white; border: none; padding: 0 20px; border-radius: 6px; font-weight: bold; cursor: pointer; height: 42px; transition: background 0.2s;">
            PDF
        </button>
    </form>
</div>

<script>
    // Fetch the list of allowed targets (Including the manager themselves)
    document.addEventListener("DOMContentLoaded", function() {
        const selectBox = document.getElementById('target_user');
        
        fetch('/api/profiles/report_targets/')
            .then(response => response.json())
            .then(data => {
                data.forEach(user => {
                    const option = document.createElement('option');
                    option.value = user.id;
                    option.text = user.username;
                    selectBox.appendChild(option);
                });
            })
            .catch(error => console.error("Error loading team:", error));
    });

    // Handle Downloads
    function downloadReport(format) {
        const targetUser = document.getElementById('target_user').value;
        const startDate = document.getElementById('start_date').value;
        const endDate = document.getElementById('end_date').value;
        
        let url = `/api/profiles/team_report/?export=${format}`;
        if (targetUser !== 'all') url += `&user_id=${targetUser}`;
        if (startDate) url += `&start_date=${startDate}`;
        if (endDate) url += `&end_date=${endDate}`;
        
        window.location.href = url;
    }

    // Handle Live Preview (Opens in a new tab!)
    function previewReport() {
        const targetUser = document.getElementById('target_user').value;
        const startDate = document.getElementById('start_date').value;
        const endDate = document.getElementById('end_date').value;
        
        let url = `/api/profiles/team_report/?export=html`;
        if (targetUser !== 'all') url += `&user_id=${targetUser}`;
        if (startDate) url += `&start_date=${startDate}`;
        if (endDate) url += `&end_date=${endDate}`;
        
        // The '_blank' parameter forces the browser to open the preview in a brand new tab!
        window.open(url, '_blank'); 
    }
</script>

{{ block.super }}
{% endblock %}
