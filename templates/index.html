{% load pwa %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Supervisor - Reports</title>
    
    {% progressive_web_app_meta %}
    
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">
    
    <div class="w-full max-w-md p-8 bg-white shadow-xl rounded-2xl text-center">
        <h2 class="text-2xl font-bold text-gray-800 mb-2">📊 Team Report</h2>
        <p class="text-sm text-gray-500 mb-6">Export task history and completion rates for your reporting line.</p>

        <form id="reportForm" class="text-left space-y-4">
            <div>
                <label for="start_date" class="block text-xs font-bold text-gray-700 mb-1">Start Date (Optional)</label>
                <input type="date" id="start_date" name="start_date" 
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500 outline-none text-gray-700">
            </div>

            <div>
                <label for="end_date" class="block text-xs font-bold text-gray-700 mb-1">End Date (Optional)</label>
                <input type="date" id="end_date" name="end_date" 
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500 outline-none text-gray-700">
            </div>

            <button type="button" onclick="downloadReport()" 
                    class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-4 rounded-lg transition duration-200 mt-2 shadow-md">
                Download CSV Report
            </button>
        </form>

        <div class="mt-8 border-t border-gray-100 pt-5">
            <a href="/admin" class="text-blue-500 hover:text-blue-700 text-sm font-semibold inline-flex items-center transition duration-200">
                <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                </svg>
                Go to Admin Dashboard
            </a>
        </div>
    </div>

    <script>
        function downloadReport() {
            const startDate = document.getElementById('start_date').value;
            const endDate = document.getElementById('end_date').value;
            
            // Build the URL to hit the exact API endpoint we just created
            let url = '/api/profiles/team_report/?export=csv';
            
            if (startDate) url += `&start_date=${startDate}`;
            if (endDate) url += `&end_date=${endDate}`;
            
            // Redirect the browser to trigger the automatic file download
            window.location.href = url;
        }
    </script>
</body>
</html>
